:root{--safe-bottom:env(safe-area-inset-bottom,12px);--safe-top:env(safe-area-inset-top,0px);--bg-deep:#050806;--bg-surface:#0a110d;--bg-card:#101a13;--bg-card-hover:#17261d;--primary:#10b981;--primary-glow:rgba(16,185,129,.35);--primary-dim:#059669;--accent:#34d399;--bamboo-gold:#a3e635;--danger:#ef4444;--warning:#f59e0b;--text-main:#f0fdf4;--text-muted:#8fa396;--text-dim:#52665b;--border-light:rgba(52,211,153,.14);--nav-height:64px;--player-height:68px;--font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;--ease-swipe:cubic-bezier(0.22,1,0.36,1);}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;}
html,body{width:100%;height:100%;background-color:var(--bg-deep);color:var(--text-main);overflow:hidden;position:fixed;}
body{display:flex;justify-content:center;align-items:center;}
#leaves-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1;transform:translate3d(0,0,0);will-change:transform;}
.app-container{width:100%;max-width:480px;height:100%;height:100vh;height:100dvh;background:var(--bg-surface);position:relative;overflow:hidden;display:flex;flex-direction:column;z-index:2;box-shadow:0 0 40px rgba(0,0,0,.95),0 0 25px rgba(16,185,129,.15);}
@media(min-width:500px){.app-container{height:94vh;border-radius:36px;border:1px solid var(--border-light);}}
.ptr-circle-wrapper{position:absolute;top:calc(var(--safe-top) + 62px);left:50%;transform:translate3d(-50%,-75px,0);width:44px;height:44px;background:#0d1a12;border:1.5px solid var(--border-light);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.8),0 0 16px var(--primary-glow);z-index:60;transition:transform .20s var(--ease-swipe),opacity .16s ease;opacity:0;pointer-events:none;will-change:transform,opacity;}
.ptr-circle-wrapper svg{width:28px;height:28px;transform:rotate(-90deg);}
.ptr-bg-circle{fill:none;stroke:rgba(52,211,153,.15);stroke-width:3.2;}
.ptr-progress-circle{fill:none;stroke:var(--primary);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .05s linear;}
.ptr-spinner-icon{position:absolute;font-size:14px;color:var(--accent);transition:transform .1s linear;}
.ptr-refreshing{animation:ptrRotate .75s cubic-bezier(0.4,0,0.2,1) infinite!important;}
@keyframes ptrRotate{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.bamboo-loading-overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0d2818 0%,#050806 85%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .20s ease;}
.bamboo-stalks{display:flex;align-items:flex-end;gap:10px;height:65px;}
.b-stalk{width:10px;background:linear-gradient(to top,#042f2e,#10b981,#34d399);border-radius:5px;position:relative;box-shadow:0 0 12px var(--primary-glow);animation:bambooGrow 0.5s ease-in-out infinite alternate;}
.b-stalk::before,.b-stalk::after{content:'';position:absolute;left:-2px;right:-2px;height:2px;background:var(--bamboo-gold);border-radius:2px;}
.b-stalk::before{top:32%;}.b-stalk::after{top:68%;}
.b-stalk:nth-child(1){height:42px;animation-delay:0s;}.b-stalk:nth-child(2){height:60px;animation-delay:.2s;}.b-stalk:nth-child(3){height:48px;animation-delay:.4s;}.b-stalk:nth-child(4){height:56px;animation-delay:.6s;}
@keyframes bambooGrow{0%{transform:scaleY(0.7);opacity:.5;}100%{transform:scaleY(1.15);opacity:1;filter:drop-shadow(0 0 10px var(--accent));}}
.bamboo-loading-text{font-size:14px;font-weight:700;letter-spacing:.6px;background:linear-gradient(90deg,#a3e635,#34d399,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.skeleton-shimmer{background:linear-gradient(90deg,#101c14 0%,#1a2f22 50%,#101c14 100%);background-size:200% 100%;animation:skeletonShimmerAnim 1.4s ease-in-out infinite;border-radius:8px;}

.skeleton-trending-card{flex:0 0 270px;height:150px;border-radius:20px;border:1px solid var(--border-light);position:relative;overflow:hidden;}

.skeleton-info{flex:1;display:flex;flex-direction:column;gap:8px;}

.skeleton-btn{width:34px;height:34px;border-radius:50%;flex-shrink:0;}
.song-content-loading{position:absolute;top:112px;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border:3px solid rgba(52,211,153,.16);border-top-color:var(--primary);border-radius:50%;animation:songContentSpin .7s linear infinite;z-index:7;display:none;pointer-events:none;box-shadow:0 0 14px var(--primary-glow);}
.song-content-loading.active{display:block;}
@keyframes songContentSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.avatar-loading-wrap{position:relative;width:76px;height:76px;margin:0 auto 10px;}

.avatar-loading-wrap.loading img{opacity:.35;}
.app-header{padding:calc(var(--safe-top) + 14px) 18px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-surface);z-index:10;flex-shrink:0;}

.view-tab-screen{width:33.333333%;height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-height) + var(--player-height) + var(--safe-bottom) + 20px);position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overscroll-behavior-x:none;touch-action:pan-y;}

.brand-hero{text-align:center;margin-bottom:24px;}

.auth-action-box{width:100%;max-width:270px;display:flex;flex-direction:column;gap:12px;}
.btn-google{width:100%;padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:#fff;color:#0f172a;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 12px var(--primary-glow);transition:transform .06s ease;}

.ban-overlay{position:absolute;inset:0;background:rgba(5,8,6,.98);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;}

.confirm-card{background:#0d1610;border:1px solid var(--border-light);border-radius:22px;padding:26px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.8),0 0 20px var(--primary-glow);}

.trending-card img{width:100%;height:100%;object-fit:cover;display:block;}.trending-card.playing-trending-card{border-color:rgba(52,211,153,.95);box-shadow:0 0 0 1px rgba(52,211,153,.5),0 0 22px rgba(16,185,129,.32),0 6px 18px rgba(0,0,0,.4);}.trending-card.playing-trending-card .trending-overlay{background:linear-gradient(to top,rgba(5,8,6,.98) 10%,rgba(5,8,6,.28) 68%,rgba(16,185,129,.08) 100%);}.trending-card.playing-trending-card h4{color:#6ee7b7;}
.trending-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,6,.95) 10%,rgba(5,8,6,.2) 65%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;}
